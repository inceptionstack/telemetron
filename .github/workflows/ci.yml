name: ci

on:
  push:
    branches:
      - main
      - v0.3.0-enrollment
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.26.2"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -trimpath -ldflags "-X main.version=ci -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" ./cmd/telemetron

  # End-to-end integration test for the v0.3.0 anonymous enrollment flow.
  # Gated behind a build tag so it is NOT part of the default `go test ./...`
  # matrix run (which already carries -race + -coverprofile across 4 OS/Go
  # combinations). Having the e2e run in its own job keeps signal clear when
  # it fails: the enrollment flow broke end-to-end, as opposed to a unit
  # regression.
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
      - run: go mod download
      - run: go test -tags=e2e -race ./cmd/telemetron/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          args: --config .golangci.yml

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
      - run: go mod download
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.4
          args: check

  package:
    # Only after every other gate is green. Produces the snapshot tarballs
    # (linux/darwin + amd64/arm64) plus checksums, uploaded as a workflow
    # artifact so every passing commit has a downloadable build.
    needs: [test, test-e2e, lint, govulncheck, goreleaser-check, secrets-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.4
          args: release --snapshot --clean
      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telemetron-snapshot-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 30

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install git-secrets
        run: |
          git clone --depth 1 https://github.com/awslabs/git-secrets.git /tmp/git-secrets
          sudo make -C /tmp/git-secrets install
      - name: Configure git-secrets patterns
        run: |
          git secrets --register-aws
          git secrets --add 'lpk_live_[0-9a-f]{32}'
          git secrets --add 'lpk_[a-z]+_[0-9a-f]+'
          git secrets --add 'ghp_[A-Za-z0-9]{36,}'
          git secrets --add 'github_pat_[A-Za-z0-9_]{82,}'
          git secrets --add 'x-access-token:[A-Za-z0-9_-]+'
          git secrets --add --allowed 'replace-with-your-bearer-token'
          git secrets --add --allowed 'your-otlp-gateway.example.com'
          # Historical Go test fixtures from commit 64247a0 used a short
          # 8-char prefix that matches lpk_[a-z]+_[0-9a-f]+. Fixtures
          # have since been replaced with a non-hex prefix (faaec40) but
          # --scan-history still reaches the old commit.
          # Allowlist requires a NON-HEX byte immediately after the
          # prefix, so no real 32-hex-char production token can match.
          git secrets --add --allowed 'lpk_live_abc[^0-9a-f]'
      - name: Scan working tree
        run: git secrets --scan
      - name: Scan full history
        run: git secrets --scan-history

  # gitleaks-action disabled: the v2+ action requires a paid GITLEAKS_LICENSE
  # secret for organization-owned repositories, and we already run git-secrets
  # with repo-specific bearer-token patterns in the secrets-scan job above.
  # Re-enable by restoring this job AND adding a GITLEAKS_LICENSE secret.
  #
  # gitleaks:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #       with:
  #         fetch-depth: 0
  #     - uses: gitleaks/gitleaks-action@v2
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #         GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

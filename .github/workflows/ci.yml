name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22", "1.23"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -trimpath -ldflags "-X main.version=ci -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" ./cmd/telemetron

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          args: --config .golangci.yml

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
      - run: go mod download
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.15.4
          args: check

  package:
    # Only after every other gate is green. Produces the snapshot tarballs
    # (linux/darwin + amd64/arm64) plus checksums, uploaded as a workflow
    # artifact so every passing commit has a downloadable build.
    needs: [test, lint, govulncheck, goreleaser-check, secrets-scan, gitleaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.15.4
          args: release --snapshot --clean
      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telemetron-snapshot-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 30

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-secrets
        run: |
          git clone --depth 1 https://github.com/awslabs/git-secrets.git /tmp/git-secrets
          sudo make -C /tmp/git-secrets install
      - name: Configure git-secrets patterns
        run: |
          git secrets --register-aws
          git secrets --add 'lpk_live_[0-9a-f]{32}'
          git secrets --add 'lpk_[a-z]+_[0-9a-f]+'
          git secrets --add 'ghp_[A-Za-z0-9]{36,}'
          git secrets --add 'github_pat_[A-Za-z0-9_]{82,}'
          git secrets --add 'x-access-token:[A-Za-z0-9_-]+'
          git secrets --add --allowed 'replace-with-your-bearer-token'
          git secrets --add --allowed 'your-otlp-gateway.example.com'
      - name: Scan working tree
        run: git secrets --scan
      - name: Scan full history
        run: git secrets --scan-history

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

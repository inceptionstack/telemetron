name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Re-run the quality gates on the tagged commit before publishing a
    # release. Someone can always tag the wrong commit; this makes sure
    # the artifacts we publish come from a commit that would also pass
    # the regular CI workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go mod download
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          args: --config .golangci.yml
      - name: Install git-secrets
        run: |
          git clone --depth 1 https://github.com/awslabs/git-secrets.git /tmp/git-secrets
          sudo make -C /tmp/git-secrets install
      - name: Configure git-secrets patterns
        run: |
          git secrets --register-aws
          git secrets --add 'lpk_live_[0-9a-f]{32}'
          git secrets --add 'lpk_[a-z]+_[0-9a-f]+'
          git secrets --add 'ghp_[A-Za-z0-9]{36,}'
          git secrets --add 'github_pat_[A-Za-z0-9_]{82,}'
          git secrets --add 'x-access-token:[A-Za-z0-9_-]+'
          git secrets --add --allowed 'replace-with-your-bearer-token'
          git secrets --add --allowed 'your-otlp-gateway.example.com'
      - run: git secrets --scan
      - run: git secrets --scan-history
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
